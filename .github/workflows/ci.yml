name: .NET CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ShopSystem.sln

    - name: Build solution
      run: dotnet build ShopSystem.sln --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test ShopSystem.sln --no-build --configuration Release --verbosity normal
